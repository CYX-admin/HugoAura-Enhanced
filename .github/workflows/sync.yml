name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Sync releases
        uses: andrewthetechie/gha-clone-releases@v1
        with:
          token: ${{ secrets.PAT }}
          src_repo: blingbling-bow/HugoAura-Enhanced
          copy_assets: true
